appId: com.hive.desktop
# The displayed name (#443). The install folder (%LOCALAPPDATA%\Programs\Hive) comes from executableName and the
# profile folder (%APPDATA%\Hive) is set in main (shared/appName.ts), so neither moves; appId keeps the uninstall entry.
productName: Hive Desktop
copyright: Copyright © 2026 Darren Marshall
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - '**/node_modules/@lydell/node-pty*/**'
  - out/main/hive-mcp.js
  - out/main/hive-progress.js
  # Code hive-mcp.js (or hive-progress.js) shares with the main process (e.g. shared/hiveGuidance.ts) is split into chunks,
  # which the CLIs load from outside the asar too.
  - out/main/chunks/**
npmRebuild: false
# Releases (and electron-updater's feed) are on GitHub. npm run dist never publishes; npm run release
# uploads a draft release. See RELEASING.md.
publish:
  provider: github
  owner: Suremise
  repo: hive-desktop
  releaseType: draft
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Hive
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hive Desktop
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Hive-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
  # Hive's languages (#767), so the installer, which follows Windows' display language without asking, never speaks one
  # the app doesn't. electron-builder's NSIS messages come in all of them (one or two of its own fall back to English).
  installerLanguages: [en_US, de_DE, es_ES, fr_FR, ja_JP, pl_PL, pt_BR, zh_CN]
  # No resources/elevate.exe (#385): electron-updater only runs it for per-machine installs (or if starting the
  # installer fails with EACCES), and Hive's per-user installer needs no administrator rights.
  packElevateHelper: false
  # Gives ALL APPLICATION PACKAGES read access to the install folder (installer.nsh).
  include: build/installer.nsh
