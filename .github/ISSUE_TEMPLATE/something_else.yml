name: Something else
description: Anything that isn't a bug, an idea or a translation.
body:
  - type: textarea
    id: what
    attributes:
      label: What it's about
      description: A question about how to use Hive may already be answered in the [user guide](https://surmise.it/docs/user-guide/).
    validations:
      required: true
  - type: input
    id: hive-version
    attributes:
      label: Hive version
      description: Help → About Hive Desktop shows it, if it matters here.
      placeholder: "0.9.0"
