# Checks every push to main and every pull request: types, lint and unit tests.
# The end-to-end suites (tests/e2e) need the real Claude Code and Codex CLIs and sign-ins, so they run
# locally before releases (npm run e2e), not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
